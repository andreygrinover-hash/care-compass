/* ---------- CSV ---------- */

function buildCsv(patientIds){
  const rows = [['Пациент', 'Дата', 'Время', 'Категория', 'Показатель', 'Значение', 'Доп']];
  patientIds.forEach(id => {
    const p = state.patients[id];
    if (!p) return;
    const recs = [];
    p.events.forEach(e => {
      const b = EVENT_MAP[e.type] || { label: e.type };
      recs.push({
        ts: e.ts, cat: 'Событие', name: b.label,
        val: (e.value !== null && e.value !== undefined) ? String(e.value) : '',
        extra: ''
      });
    });
    p.pressure.forEach(e => {
      recs.push({
        ts: e.ts, cat: 'Давление', name: 'АД',
        val: e.sys + '/' + e.dia,
        extra: e.pulse ? 'пульс ' + e.pulse : ''
      });
    });
    p.sugar.forEach(e => {
      recs.push({ ts: e.ts, cat: 'Сахар', name: 'Глюкоза', val: String(e.value), extra: '' });
    });
    recs.sort((a, b) => a.ts - b.ts);
    recs.forEach(r => {
      const d = new Date(r.ts);
      rows.push([p.name, todayKey(d), pad2(d.getHours()) + ':' + pad2(d.getMinutes()),
        r.cat, r.name, r.val, r.extra]);
    });
  });
  return rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
}

async function importCsvText(text){
  const rows = parseCSV(text);
  if (rows.length < 2){ showToast('CSV пуст или неверного формата', 'error'); return; }
  const head = rows[0].map(h => String(h).trim().toLowerCase());
  if (head[0].indexOf('пациент') === -1 && head[0].indexOf('patient') === -1){
    showToast('Не найден столбец «Пациент»', 'error');
    return;
  }

  const mode = await modalChoice('Как импортировать CSV-данные?', [
    { label: 'Добавить к существующим', value: 'append' },
    { label: 'Заменить все записи', value: 'replace', danger: true }
  ]);
  if (!mode) return;

  if (mode === 'replace'){
    Object.values(state.patients).forEach(p => { p.events = []; p.pressure = []; p.sugar = []; });
  }

  let added = 0;
  for (let i = 1; i < rows.length; i++){
    const r = rows[i];
    if (r.length < 6) continue;
    const pname = String(r[0]).trim();
    const dateStr = String(r[1]).trim();
    const timeStr = String(r[2]).trim() || '00:00';
    const cat = String(r[3]).trim();
    const name = String(r[4]).trim();
    const val = String(r[5]).trim();
    const extra = r[6] ? String(r[6]).trim() : '';

    let ts = new Date(dateStr + 'T' + timeStr).getTime();
    if (isNaN(ts)) ts = Date.now();

    let p = Object.values(state.patients).find(x => x.name === pname);
    if (!p){
      p = newPatient(pname);
      state.patients[p.id] = p;
    }

    if (cat === 'Событие'){
      const btn = EVENT_BUTTONS.find(b => b.label.toLowerCase() === name.toLowerCase());
      const type = btn ? btn.type : name;
      let num = null;
      if (val !== ''){
        const n = parseFloat(val.replace(',', '.'));
        if (!isNaN(n)) num = n;
      }
      p.events.push({ id: uid(), ts: ts, type: type, value: num });
      added++;
    } else if (cat === 'Давление'){
      const parts = val.split('/');
      const sys = parseFloat(String(parts[0] || '').replace(',', '.'));
      const dia = parseFloat(String(parts[1] || '').replace(',', '.'));
      if (isNaN(sys) || isNaN(dia)) continue;
      const pm = extra.match(/\d+/);
      p.pressure.push({ id: uid(), ts: ts, sys: sys, dia: dia, pulse: pm ? parseInt(pm[0], 10) : null });
      added++;
    } else if (cat === 'Сахар'){
      const v = parseFloat(val.replace(',', '.'));
      if (isNaN(v)) continue;
      p.sugar.push({ id: uid(), ts: ts, value: v });
      added++;
    }
  }

  save();
  render();
  showToast('Импортировано записей: ' + added, 'ok');
}

/* ---------- JSON ---------- */

function sameVal(a, b){
  if ((a === null || a === undefined) && (b === null || b === undefined)) return true;
  return String(a) === String(b);
}

function mergeInto(dst, src){
  let added = 0, skipped = 0;
  src.events.forEach(e => {
    const dup = dst.events.some(x => x.ts === e.ts && x.type === e.type && sameVal(x.value, e.value));
    if (dup){ skipped++; return; }
    dst.events.push(Object.assign({}, e, { id: uid() }));
    added++;
  });
  src.pressure.forEach(e => {
    const dup = dst.pressure.some(x => x.ts === e.ts && Number(x.sys) === Number(e.sys) && Number(x.dia) === Number(e.dia));
    if (dup){ skipped++; return; }
    dst.pressure.push(Object.assign({}, e, { id: uid() }));
    added++;
  });
  src.sugar.forEach(e => {
    const dup = dst.sugar.some(x => x.ts === e.ts && sameVal(x.value, e.value));
    if (dup){ skipped++; return; }
    dst.sugar.push(Object.assign({}, e, { id: uid() }));
    added++;
  });
  src.meds.forEach(m => {
    const dup = dst.meds.some(x => x.id === m.id ||
      (String(x.name).trim().toLowerCase() === String(m.name).trim().toLowerCase() && (x.dose || '') === (m.dose || '')));
    if (dup){ skipped++; return; }
    dst.meds.push(Object.assign({}, m));
    added++;
  });
  Object.keys(src.medLog || {}).forEach(date => {
    if (!dst.medLog[date]) dst.medLog[date] = {};
    Object.assign(dst.medLog[date], src.medLog[date]);
  });
  return { added: added, skipped: skipped };
}

async function importJsonText(text){
  let data;
  try { data = JSON.parse(text); }
  catch (e){ showToast('Некорректный JSON-файл', 'error'); return; }

  if (!data || typeof data !== 'object' || !data.patients){
    showToast('Неверная структура файла', 'error');
    return;
  }

  const mode = await modalChoice('Как импортировать JSON?', [
    { label: 'Добавить к существующим', value: 'append' },
    { label: 'Заменить все данные', value: 'replace', danger: true }
  ]);
  if (!mode) return;

  const imported = normalizeState(JSON.parse(JSON.stringify(data)));

  let added = 0, skipped = 0;
  if (mode === 'replace'){
    state = imported;
  } else {
    Object.keys(imported.patients).forEach(id => {
      const ip = imported.patients[id];
      const existing = Object.values(state.patients).find(p => p.name === ip.name);
      if (existing){
        const r = mergeInto(existing, ip);
        added += r.added;
        skipped += r.skipped;
      } else {
        ip.id = uid();
        state.patients[ip.id] = ip;
        added++;
      }
    });
  }

  save();
  render();
  if (mode === 'replace') showToast('Импорт завершён: данные заменены', 'ok');
  else showToast('Импорт завершён: новых записей ' + added + (skipped ? ', дубликатов пропущено ' + skipped : ''), 'ok');
}

async function addPatient(){
  const name = await promptModal('Имя нового пациента', 'Пациент ' + (Object.keys(state.patients).length + 1));
  if (name === null) return;
  const trimmed = String(name).trim();

  state.patients[p.id] = p;
  state.currentPatientId = p.id;
  save();
  render();
  showToast('Пациент добавлен', 'ok');
}

async function renamePatient(){
  const p = currentPatient();
  const name = await promptModal('Новое имя пациента', p.name);
  if (name === null) return;
  const trimmed = String(name).trim();
  if (!trimmed) return;
  p.name = trimmed;

async function deletePatient(){
  const ids = Object.keys(state.patients);
  if (ids.length <= 1){
    showToast('Нельзя удалить единственного пациента', 'error');
    return;
  }
  const p = currentPatient();
  const ok = await modalConfirm(
    'Удалить пациента «' + p.name + '» и все его данные?\nДействие необратимо.',
    { okText: 'Удалить', danger: true }
  );
  if (!ok) return;
  delete state.patients[p.id];
  state.currentPatientId = Object.keys(state.patients)[0];
  save();
  render();
  showToast('Пациент удалён', 'ok');
}

function promptModal(title, defaultValue){
  return new Promise((resolve) => {
    modalResolve = resolve;
    openModal(
      '<h3>' + escapeHtml(title) + '</h3>' +
      '<label class="field"><span>Название</span><input id="promptInput" type="text" value="' + escapeHtml(defaultValue || '') + '"></label>' +
      '<div class="modal-actions">' +
        '<button class="btn" data-modal-cancel>Отмена</button>' +
        '<button class="btn primary" data-modal-ok>OK</button>' +
      '</div>'
    );
    const inp = document.getElementById('promptInput');
    inp.focus();
    inp.select();
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter'){ resolveModal(inp.value); }
    });
    // перехватываем OK, чтобы вернуть значение поля
    const obs = new MutationObserver(() => {
      if (!modalRoot.classList.contains('open')){
        obs.disconnect();
        if (modalResolve === resolve){
          const r = modalResolve; modalResolve = null;
          if (r) r(null);
        }
      }
    });
    obs.observe(modalRoot, { attributes: true, attributeFilter: ['class'] });
    modalRoot.querySelector('[data-modal-ok]').addEventListener('click', (e) => {
      e.stopPropagation();
      resolveModal(inp.value);
    }, true);
  });
}

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  switch (action){
    case 'tab':
      state.ui.activeTab = el.dataset.tab;
      medsEditMode = false;
      save();
      render();
      break;

    case 'configTabs':
      openTabsConfig();
      break;

    case 'configEventButtons':
      openEventButtonsConfig();
      break;

    case 'addEvent':
      addEvent(el.dataset.type);
      break;

    case 'addValueEvent':
      openValueEventModal(el.dataset.type);
      break;

    case 'delEvent': {
      const p = currentPatient();
      const idx = p.events.findIndex(x => x.id === el.dataset.id);
      if (idx === -1) break;
      const item = p.events.splice(idx, 1)[0];
      save();
      renderView();
      undoableToast('Событие удалено', () => {
        p.events.splice(Math.min(idx, p.events.length), 0, item);
        save();
        renderView();
      });
      break;
    }

    case 'addPressure':
      submitPressure();
      break;

    case 'delPressure': {
      const p = currentPatient();
      const idx = p.pressure.findIndex(x => x.id === el.dataset.id);
      if (idx === -1) break;
      const item = p.pressure.splice(idx, 1)[0];
      save();
      renderView();
      undoableToast('Измерение удалено', () => {
        p.pressure.splice(Math.min(idx, p.pressure.length), 0, item);
        save();
        renderView();
      });
      break;
    }

    case 'addSugar':
      submitSugar();
      break;

    case 'delSugar': {
      const p = currentPatient();
      const idx = p.sugar.findIndex(x => x.id === el.dataset.id);
      if (idx === -1) break;
      const item = p.sugar.splice(idx, 1)[0];
      save();
      renderView();
      undoableToast('Измерение сахара удалено', () => {
        p.sugar.splice(Math.min(idx, p.sugar.length), 0, item);
        save();
        renderView();
      });
      break;
    }

    case 'addMed':
      openMedModal(null);
      break;

    case 'medsEdit':
      medsEditMode = true;
      renderView();
      break;

    case 'medsDone':
      medsEditMode = false;
      renderView();
      break;

    case 'editMed':
      openMedModal(el.dataset.id);
      break;

    case 'delMed': {
      const p = currentPatient();
      const idx = p.meds.findIndex(m => m.id === el.dataset.id);
      if (idx === -1) break;
      const item = p.meds.splice(idx, 1)[0];
      save();
      renderView();
      undoableToast('Лекарство удалено', () => {
        p.meds.splice(Math.min(idx, p.meds.length), 0, item);
        save();
        renderView();
      });
      break;
    }

    case 'stopMed': {
      const p = currentPatient();
      const med = p.meds.find(x => x.id === el.dataset.id);
      if (!med || med.status === 'stopped') break;
      med.status = 'stopped';
      med.stoppedTs = Date.now();
      (p.medChanges = p.medChanges || []).push({ ts: Date.now(), action: 'stopped', name: med.name, dose: med.dose || '' });
      save();
      renderView();
      showToast('Препарат отменён — история приёмов сохранена', 'ok');
      break;
    }

    case 'restartMed': {
      const p = currentPatient();
      const med = p.meds.find(x => x.id === el.dataset.id);
      if (!med || med.status !== 'stopped') break;
      med.status = 'active';
      med.stoppedTs = null;
      med.created = Date.now();
      (p.medChanges = p.medChanges || []).push({ ts: Date.now(), action: 'restarted', name: med.name, dose: med.dose || '' });
      save();
      renderView();
      showToast('Препарат возобновлён — приёмы считаются с сегодняшнего дня', 'ok');
      break;
    }

    case 'togglePressureList':
      state.ui.pressureListExpanded = !state.ui.pressureListExpanded;
      save();
      renderView();
      break;

    case 'toggleSugarList':
      state.ui.sugarListExpanded = !state.ui.sugarListExpanded;
      save();
      renderView();
      break;

    case 'takeMed':
      toggleMed(el.dataset.id, el.dataset.slot);
      break;

    case 'genReport':
      renderView();
      showToast('Отчёт сформирован', 'ok');
      break;

    case 'copyReport':
      copyReport();
      break;

    case 'printReport':
      window.print();
      break;

    case 'exportCsvOne':
      download('kompas-' + sanitizeFile(currentPatient().name) + '-' + todayKey() + '.csv',
        buildCsv([state.currentPatientId]), 'text/csv');
      showToast('CSV сохранён', 'ok');
      break;

    case 'exportCsvAll':
      download('kompas-vse-patients-' + todayKey() + '.csv',
        buildCsv(Object.keys(state.patients)), 'text/csv');
      showToast('CSV сохранён', 'ok');
      break;

    case 'pickSuggest': {
      const panel = document.getElementById('patientSearchPanel');
      const field = document.getElementById('patientField');
      if (panel) panel.hidden = true;
      if (field) field.setAttribute('aria-expanded', 'false');
      const inp = document.getElementById('patientSearch');
      if (inp) inp.value = '';
      state.currentPatientId = el.dataset.id;
      save();
      render();
      break;
    }

    case 'goBackup':
      state.ui.activeTab = 'data';
      save();
      render();
      break;

    case 'shareBackup':
      shareBackup();
      break;

    case 'restoreSnap':
      restoreSnap(Number(el.dataset.ts));
      break;

    case 'exportJson':
      download('kompas-backup-' + todayKey() + '.json',
        JSON.stringify(state, null, 2), 'application/json');
      markExport();
      showToast('Резервная копия сохранена', 'ok');
      break;

    case 'importJson':
      document.getElementById('fileJson').click();
      break;

    case 'importCsv':
      document.getElementById('fileCsv').click();
      break;

    case 'clearAll':
      clearAllData();
      break;
  }
});

function sanitizeFile(s){
  return String(s).replace(/[^\wа-яА-ЯёЁ\-]+/g, '_').slice(0, 40) || 'patient';
}

async function clearAllData(){
  const ok = await modalConfirm(
    'Удалить ВСЕ данные приложения (все пациенты, события, измерения, лекарства)?\nЭто действие необратимо.',
    { okText: 'Удалить всё', danger: true }
  );
  if (!ok) return;

  const backup = await modalConfirm(
    'Сделать резервную копию (JSON) перед удалением?',
    { okText: 'Да, скачать', cancelText: 'Нет, удалить' }
  );
  if (backup){
    download('kompas-backup-' + todayKey() + '.json',
      JSON.stringify(state, null, 2), 'application/json');
  }

  try { localStorage.removeItem(STORE_KEY); } catch (err){ /* ignore */ }
  state = defaultState();
  save();
  render();
  showToast('Все данные удалены', 'ok');
}

/* ============================ INIT ============================ */

render();

/* ============================ PWA ============================ */

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
