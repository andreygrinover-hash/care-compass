<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Компас заботы">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%232563eb%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2219%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223.5%22%2F%3E%3Cpolygon%20points%3D%2232%2C13%2027%2C32%2037%2C32%22%20fill%3D%22%23ef4444%22%2F%3E%3Cpolygon%20points%3D%2232%2C51%2027%2C32%2037%2C32%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%222.6%22%20fill%3D%22%232563eb%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221.4%22%2F%3E%3C%2Fsvg%3E">
<title>Компас заботы</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#f4f6fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --border:#e2e8f0;
    --primary:#2563eb; --primary-2:#1d4ed8; --primary-fg:#ffffff;
    --danger:#dc2626; --warn:#d97706; --ok:#16a34a;
    --ok-bg:#dcfce7; --warn-bg:#fef3c7; --high-bg:#ffedd5; --crit-bg:#fee2e2;
    --radius:14px; --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  }
  html[data-theme="dark"]{
    --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --border:#334155;
    --primary:#3b82f6; --primary-2:#2563eb; --primary-fg:#ffffff;
    --danger:#f87171; --warn:#fbbf24; --ok:#4ade80;
    --ok-bg:#14532d; --warn-bg:#78350f; --high-bg:#7c2d12; --crit-bg:#7f1d1d;
    --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  html{font-size:16px}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
    background:var(--bg);color:var(--text);font-size:1rem;line-height:1.45;
    transition:background .2s,color .2s;padding-bottom:48px;
  }
  body.no-scroll{overflow:hidden}
  h1,h2,h3{margin:0;font-weight:650}
  h1{font-size:1.15rem;letter-spacing:.2px}
  h2{font-size:1.02rem}
  h3{font-size:1rem}
  .top-bar{position:sticky;top:0;z-index:30;background:var(--card);box-shadow:var(--shadow);border-bottom:1px solid var(--border)}
  .app-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 6px}
  .brand{display:flex;align-items:center;gap:8px;min-width:0}
  .brand .logo{font-size:1.25rem}
  .brand h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .header-actions{display:flex;gap:4px;flex-shrink:0}
  .icon-btn{
    border:1px solid var(--border);background:var(--card);color:var(--text);
    border-radius:10px;width:36px;height:36px;font-size:1rem;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;transition:.15s;
    flex-shrink:0;
  }
  .icon-btn:hover{border-color:var(--primary);color:var(--primary)}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn.small-text{font-size:.78rem;font-weight:700;width:38px}
  .icon-btn.del{width:30px;height:30px;font-size:.8rem;border-color:transparent;opacity:.6}
  .icon-btn.del:hover{opacity:1;color:var(--danger);border-color:var(--danger)}
  .patient-bar{display:flex;align-items:center;gap:6px;padding:0 12px 8px}
  .patient-label{font-size:.8rem;color:var(--muted);flex-shrink:0}
  .patient-field{
    display:flex;align-items:center;gap:6px;flex:1;min-width:0;padding:7px 10px;border-radius:10px;
    border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.92rem;font-family:inherit;cursor:pointer;
  }
  .patient-field-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .patient-caret{color:var(--muted);font-size:.8rem;flex-shrink:0}
  .search-panel{padding:0 12px 10px}
  .search-panel[hidden]{display:none}
  .search-input{
    width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);font-size:.95rem;font-family:inherit;
  }
  .search-list{margin-top:8px;max-height:230px;overflow-y:auto}
  .search-item{
    display:block;width:100%;text-align:left;padding:10px 12px;border:none;border-radius:9px;
    background:transparent;color:var(--text);font-family:inherit;font-size:.92rem;cursor:pointer;
  }
  .search-item:hover{background:var(--bg)}
  .search-item.cur{color:var(--primary);font-weight:600}
  .tabs{
    display:flex;gap:6px;overflow-x:auto;padding:0 10px 8px;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;
    border:1px solid transparent;background:transparent;color:var(--muted);
    font-size:.86rem;font-family:inherit;cursor:pointer;white-space:nowrap;transition:.15s;font-weight:500;
  }
  .tab:hover{color:var(--text);background:var(--bg)}
  .tab.active{background:var(--primary);color:var(--primary-fg);box-shadow:var(--shadow)}
  .tab .tab-icon{font-size:.95rem}
  .tab.config{margin-left:auto;border:1px dashed var(--border);color:var(--muted)}
  .tab.config:hover{border-color:var(--primary);color:var(--primary)}
  .view{max-width:900px;margin:0 auto;padding:14px 12px 40px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .muted{color:var(--muted);font-size:.82rem}
  .event-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .event-btn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:12px 6px;border-radius:12px;border:1px solid var(--border);background:var(--bg);
    color:var(--text);font-size:.8rem;font-family:inherit;cursor:pointer;transition:.15s;
    font-weight:500;text-align:center;line-height:1.2;min-height:74px;
  }
  .event-btn:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
  .event-btn:active{transform:scale(.97)}
  .event-btn.value{border-style:dashed}
  .ev-icon{font-size:1.3rem;line-height:1}
  .list{display:flex;flex-direction:column;gap:2px}
  .row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  .row-icon{font-size:1.1rem;width:24px;text-align:center;flex-shrink:0}
  .row-main{flex:1;min-width:0}
  .row-title{font-size:.9rem;font-weight:550;overflow:hidden;text-overflow:ellipsis}
  .row-sub{font-size:.76rem;color:var(--muted)}
  .row-val{font-weight:700;color:var(--primary)}
  .empty{color:var(--muted);font-size:.85rem;text-align:center;padding:18px 6px}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:.85rem;color:var(--muted)}
  .field span{font-weight:600}
  .field input,.field select,.field textarea{
    padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);
    color:var(--text);font-size:.95rem;font-family:inherit;width:100%;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--primary);outline-offset:-1px}
  .form-row{display:flex;gap:10px;flex-wrap:wrap}
  .form-row .field{flex:1;min-width:96px}
  .btn{
    padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);
    color:var(--text);font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:.15s;
  }
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
  .btn.primary:hover{background:var(--primary-2);color:#fff}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.danger:hover{filter:brightness(.93);color:#fff}
  .btn.sm{padding:7px 12px;font-size:.82rem}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap}
  .inline-select{
    padding:6px 10px;border-radius:9px;border:1px solid var(--border);background:var(--bg);
    color:var(--text);font-family:inherit;font-size:.85rem;
  }
  .rep-dates{display:flex;gap:6px;align-items:center;margin-bottom:12px;font-size:.86rem}
  .rep-dates-label{color:var(--muted);flex-shrink:0}
  .rep-dates input[type="date"]{flex:1;min-width:0;padding:6px 8px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:.85rem}
  .rep-hint{font-size:.84rem;color:var(--muted);margin-bottom:12px}
  .alert{padding:11px 14px;border-radius:11px;font-size:.86rem;margin-bottom:12px;border:1px solid transparent;font-weight:500}
  .alert.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
  .alert.crit{background:var(--crit-bg);color:var(--danger);border-color:var(--danger)}
  .alert.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .badge.high{background:var(--high-bg);color:var(--warn)}
  .badge.crit{background:var(--crit-bg);color:var(--danger)}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .stat{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:11px 12px}
  .stat .stat-label{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
  .stat .stat-value{font-size:1.22rem;font-weight:700;margin-top:3px}
  .stat .stat-sub{font-size:.75rem;color:var(--muted);margin-top:2px}
  .chart{width:100%;height:auto;display:block;color:var(--text);margin-top:6px}
  .chart-wrap{margin-top:8px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:6px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
  .modal-root{position:fixed;inset:0;z-index:100;display:none}
  .modal-root.open{display:block}
  .backdrop{position:absolute;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
  .modal{
    background:var(--card);color:var(--text);border-radius:16px;padding:18px;width:100%;max-width:440px;
    max-height:86vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .16s ease-out;
  }
  @keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:scale(1);opacity:1}}
  .modal h3{margin-bottom:12px}
  .modal-body{font-size:.9rem;line-height:1.55;white-space:pre-wrap}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .modal-actions.col{flex-direction:column}
  .modal-actions.col .btn{width:100%}
  .checkbox-list{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow-y:auto}
  .check{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:9px;cursor:pointer;font-size:.9rem}
  .check:hover{background:var(--bg)}
  .check input{width:18px;height:18px;accent-color:var(--primary);cursor:pointer}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#111827;color:#fff;
    padding:11px 18px;border-radius:11px;opacity:0;pointer-events:none;transition:.25s;z-index:2000;
    font-size:.87rem;max-width:90vw;text-align:center;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.3)
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.error{background:var(--danger)}
  .toast.ok{background:var(--ok)}
  .toast-btn{
    margin-left:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);
    color:#fff;border-radius:8px;padding:3px 12px;font:inherit;cursor:pointer
  }
  .app-footer{ text-align:center;color:var(--muted);font-size:.78rem;padding:6px 16px 24px }
  pre.report{
    white-space:pre-wrap;word-wrap:break-word;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:.82rem;line-height:1.55;background:var(--bg);border:1px solid var(--border);
    border-radius:12px;padding:14px;margin:0;max-height:60vh;overflow:auto;color:var(--text)
  }
  .report-doc{font-size:.95rem}
  @media screen{ .report-doc{max-height:70vh;overflow:auto} }
  .report-doc h3.rep-title{margin:0 0 4px;font-size:1.2em}
  .report-doc h4{margin:16px 0 6px;font-size:1em}
  .rep-meta{color:var(--muted);margin:0 0 4px;font-size:.9em}
  .rep-flags{list-style:none;margin:0;padding:0}
  .rep-flags li{margin:5px 0;line-height:1.45}
  .flag-crit{color:var(--danger);font-weight:600}
  .flag-warn{color:var(--warn)}
  .flag-ok{color:var(--ok)}
  .rep-note{margin:8px 0;padding:8px 10px;background:var(--bg);border-radius:8px}
  .rep-table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:.93em}
  .rep-table th,.rep-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
  .rep-table th{color:var(--muted);font-weight:600;font-size:.9em}
  .rep-crit td{color:var(--danger);font-weight:600}
  .rep-warn td{color:var(--warn)}
  .rep-empty{color:var(--muted);font-style:italic;margin:4px 0}
  .rep-list{margin:4px 0;padding-left:18px}
  .rep-list.rep-days{list-style:none;padding-left:0}
  .rep-footer{color:var(--muted);font-size:.85em;margin-top:14px;border-top:1px solid var(--border);padding-top:8px}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  .backup-banner{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .snap-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:.95em}
  .snap-row:last-of-type{border-bottom:none}
  .danger-title{color:var(--danger)}
  .slot-head{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}
  .slot-head:first-child{margin-top:0}
  .med-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:12px;margin-bottom:7px;background:var(--bg)}
  .med-row.taken{border-color:var(--ok);background:var(--ok-bg)}
  .med-row.stopped{opacity:.55}
  .med-info{flex:1;min-width:0}
  .med-name{font-weight:600;font-size:.9rem}
  .med-dose{font-size:.78rem;color:var(--muted)}
  .med-actions{display:flex;gap:5px;flex-shrink:0}
  .sep{height:1px;background:var(--border);margin:14px 0}
  @media (max-width:520px){
    .brand h1{font-size:1rem}
    .tab{padding:7px 10px;font-size:.8rem}
    .tab .tab-label{display:none}
    .tab.active .tab-label{display:inline}
    .view{padding:12px 8px 40px}
  }
  @media print{
    .top-bar,.no-print,.toast,.modal-root{display:none !important}
    body{background:#fff;color:#000;padding:0}
    .view{padding:0;max-width:none}
    .card{box-shadow:none;border:none;padding:0}
    pre.report{max-height:none;border:none;background:#fff;font-size:11pt}
  }
</style>
</head>
<body>

<div class="top-bar">
  <header class="app-header">
    <div class="brand">
      <span class="logo">🧭</span>
      <h1>Компас заботы</h1>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btnHelp" title="Руководство" aria-label="Руководство">❓</button>
      <button class="icon-btn" id="btnTheme" title="Переключить тему" aria-label="Тема">🌙</button>
      <button class="icon-btn small-text" id="btnFontMinus" title="Уменьшить шрифт" aria-label="Уменьшить шрифт">A−</button>
      <button class="icon-btn small-text" id="btnFontPlus" title="Увеличить шрифт" aria-label="Увеличить шрифт">A+</button>
      <button class="icon-btn" id="btnTabsConfig" title="Настроить вкладки" aria-label="Настроить вкладки">📋</button>
    </div>
  </header>
  <div class="patient-bar">
    <span class="patient-label">Пациент</span>
    <button type="button" id="patientField" class="patient-field" aria-haspopup="listbox" aria-expanded="false">
      <span id="patientFieldName" class="patient-field-name"></span>
      <span class="patient-caret" aria-hidden="true">▾</span>
    </button>
    <button class="icon-btn" id="btnAddPatient" title="Добавить пациента" aria-label="Добавить пациента">➕</button>
    <button class="icon-btn" id="btnRenamePatient" title="Переименовать" aria-label="Переименовать">✏️</button>
    <button class="icon-btn" id="btnDeletePatient" title="Удалить" aria-label="Удалить">🗑️</button>
  </div>
  <div id="patientSearchPanel" class="search-panel" hidden>
    <input id="patientSearch" class="search-input" type="search" inputmode="search" autocomplete="off" placeholder="Имя пациента…" aria-label="Поиск пациента">
    <div id="patientSearchList" class="search-list"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>

<main id="view" class="view"></main>

<footer class="app-footer no-print">🔒 Все данные хранятся только в вашем браузере и никуда не отправляются.</footer>

<div id="modalRoot" class="modal-root"></div>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileCsv" accept=".csv,text/csv" hidden>

<script>
'use strict';

/* ============================ CONSTANTS ============================ */

const STORE_KEY = 'kompas_care_v1';

const PERIODS = [3, 7, 14, 30, 60, 90];

const TABS = [
  { id:'events',   label:'События',    icon:'📋' },
  { id:'pressure', label:'Давление',   icon:'❤️' },
  { id:'sugar',    label:'Сахар',      icon:'🩸' },
  { id:'meds',     label:'Лекарства',  icon:'💊' },
  { id:'stats',    label:'Статистика', icon:'📊' },
  { id:'report',   label:'Отчёт',      icon:'📄' },
  { id:'data',     label:'Данные',     icon:'💾' }
];

const EVENT_BUTTONS = [
  { type:'toilet',   label:'Туалет',          icon:'🚽' },
  { type:'episode',  label:'Эпизод',          icon:'⚡' },
  { type:'dry',      label:'Сухо',            icon:'🌵' },
  { type:'wet',      label:'Мокро',           icon:'💧' },
  { type:'activity', label:'Занятие',         icon:'🎨' },
  { type:'sleep',    label:'Сон',             icon:'😴' },
  { type:'good',     label:'Хорошо',          icon:'😊' },
  { type:'bad',      label:'Плохо',           icon:'😟' },
  { type:'refuse',   label:'Отказ от еды',    icon:'🍽️' },
  { type:'headache', label:'Головная боль',   icon:'🤕' },
  { type:'fall',     label:'Падение',         icon:'⚠️' },
  { type:'temp',     label:'Температура',     icon:'🌡️', kind:'value', unit:'°C', step:0.1 },
  { type:'weight',   label:'Вес',             icon:'⚖️', kind:'value', unit:'кг', step:0.1 }
];

const EVENT_MAP = Object.fromEntries(EVENT_BUTTONS.map(b => [b.type, b]));

const SLOTS = [
  { id:'morning',  label:'Утро',              icon:'🌅' },
  { id:'day',      label:'День',              icon:'☀️' },
  { id:'evening',  label:'Вечер',             icon:'🌇' },
  { id:'night',    label:'Ночь',              icon:'🌙' },
  { id:'asneeded', label:'По необходимости',  icon:'🩹' }
];

/* ============================ UTILS ============================ */

function uid(){
  return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
}

function pad2(n){ return String(n).padStart(2, '0'); }

function todayKey(d){
  d = d || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function fmtDate(ts){
  const d = new Date(ts);
  return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear();
}

function fmtDateTime(ts){
  const d = new Date(ts);
  return fmtDate(ts) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

function fmtNum(v){
  const n = Math.round(v * 10) / 10;
  return String(n);
}

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

function avg(arr){
  if (!arr.length) return 0;
  return arr.reduce((s, x) => s + x, 0) / arr.length;
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}

function periodStart(days){
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - (days - 1));
  return d.getTime();
}

function reportRange(days){
  if (state.ui.reportCustom && state.ui.reportFrom && state.ui.reportTo){
    const f = new Date(state.ui.reportFrom + 'T00:00:00').getTime();
    const t = new Date(state.ui.reportTo + 'T23:59:59').getTime();
    if (!isNaN(f) && !isNaN(t) && f <= t){
      return { from: f, to: t, span: Math.max(1, Math.round((t - f) / 86400000)) };
    }
  }
  return { from: periodStart(days), to: Date.now(), span: days };
}

function csvEscape(v){
  v = String(v == null ? '' : v);
  if (/[",;\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
  return v;
}

function parseCSV(text){
  const rows = [];
  let cur = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQ){
      if (c === '"'){
        if (text[i + 1] === '"'){ field += '"'; i++; }
        else inQ = false;
      } else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',' || c === ';'){ cur.push(field); field = ''; }
      else if (c === '\n'){ cur.push(field); field = ''; rows.push(cur); cur = []; }
      else if (c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if (field !== '' || cur.length){ cur.push(field); rows.push(cur); }
  return rows.filter(r => r.length && r.some(x => String(x).trim() !== ''));
}

function download(filename, content, mime){
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
}

function showToast(msg, type){
  let t = document.getElementById('toast');
  if (!t){
    t = document.createElement('div');
    t.id = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = 'toast'; }, 3200);
}

function undoableToast(msg, undoFn){
  let t = document.getElementById('toast');
  if (!t){
    t = document.createElement('div');
    t.id = 'toast';
    document.body.appendChild(t);
  }
  t.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  const btn = document.createElement('button');
  btn.className = 'toast-btn';
  btn.type = 'button';
  btn.textContent = 'Отменить';
  btn.addEventListener('click', () => {
    clearTimeout(t._h);
    t.className = 'toast';
    undoFn();
  });
  t.appendChild(span);
  t.appendChild(btn);
  t.className = 'toast show';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = 'toast'; }, 6000);
}

function newPatient(name){

    name: name || 'Пациент',

    pressure: [],
    sugar: [],
    meds: [],
    medLog: {},
    medChanges: [],
    settings: { hiddenTabs: [], hiddenEventButtons: [] }
  };
}

function defaultState(){
  const p = newPatient('Пациент 1');
  return {
    currentPatientId: p.id,
    patients: { [p.id]: p },
    ui: {
      theme: 'light',
      fontSize: 16,
      activeTab: 'events',
      statsPeriod: 7,
      reportPeriod: 7,
      pressurePeriod: 7,
      sugarPeriod: 7
    }
  };
}

function normalizeState(s){
  if (!s || typeof s !== 'object') return defaultState();
  if (!s.patients || typeof s.patients !== 'object' || !Object.keys(s.patients).length) return defaultState();

  s.ui = s.ui || {};
  s.ui.theme = s.ui.theme === 'dark' ? 'dark' : 'light';
  s.ui.fontSize = clamp(Number(s.ui.fontSize) || 16, 12, 24);
  s.ui.activeTab = TABS.some(t => t.id === s.ui.activeTab) ? s.ui.activeTab : 'events';
  const PER = PERIODS;
  s.ui.statsPeriod = PER.includes(Number(s.ui.statsPeriod)) ? Number(s.ui.statsPeriod) : 7;
  s.ui.reportPeriod = PER.includes(Number(s.ui.reportPeriod)) ? Number(s.ui.reportPeriod) : 7;
  s.ui.pressurePeriod = PER.includes(Number(s.ui.pressurePeriod)) ? Number(s.ui.pressurePeriod) : 7;
  s.ui.sugarPeriod = PER.includes(Number(s.ui.sugarPeriod)) ? Number(s.ui.sugarPeriod) : 7;
  s.ui.reportCustom = !!s.ui.reportCustom;
  s.ui.reportFrom = (typeof s.ui.reportFrom === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s.ui.reportFrom)) ? s.ui.reportFrom : '';
  s.ui.reportTo = (typeof s.ui.reportTo === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s.ui.reportTo)) ? s.ui.reportTo : '';

  for (const id of Object.keys(s.patients)){
    const p = s.patients[id] || {};
    p.id = id;
    p.name = typeof p.name === 'string' && p.name.trim() ? p.name : 'Пациент';
    p.note = typeof p.note === 'string' ? p.note : '';
    p.events = Array.isArray(p.events) ? p.events : [];
    p.pressure = Array.isArray(p.pressure) ? p.pressure : [];
    p.sugar = Array.isArray(p.sugar) ? p.sugar : [];
    p.meds = Array.isArray(p.meds) ? p.meds : [];
    p.meds = p.meds.map(m => {
      if (!Array.isArray(m.slots) || !m.slots.length){
        m.slots = [m.slot || 'morning'];
      }
      if (!m.created) m.created = Date.now();
      m.status = (m.status === 'stopped') ? 'stopped' : 'active';
      m.stoppedTs = (typeof m.stoppedTs === 'number') ? m.stoppedTs : null;
      return m;
    });
    p.medChanges = Array.isArray(p.medChanges) ? p.medChanges : [];
    Object.keys(p.medLog).forEach(day => {
      const dayLog = p.medLog[day];
      const next = {};
      Object.keys(dayLog).forEach(k => {
        if (k.indexOf('|') === -1){
          const med = p.meds.find(x => x.id === k);
          next[med ? (med.slots[0] + '|' + k) : k] = dayLog[k];
        } else next[k] = dayLog[k];
      });
      p.medLog[day] = next;
    });
    let gs = parseInt(p.goalSys, 10); if (isNaN(gs)) gs = 140; p.goalSys = Math.min(200, Math.max(90, gs));
    let gd = parseInt(p.goalDia, 10); if (isNaN(gd)) gd = 90; p.goalDia = Math.min(120, Math.max(50, gd));
    p.medLog = (p.medLog && typeof p.medLog === 'object') ? p.medLog : {};
    p.settings = p.settings || {};
    p.settings.hiddenTabs = Array.isArray(p.settings.hiddenTabs) ? p.settings.hiddenTabs : [];
    p.settings.hiddenEventButtons = Array.isArray(p.settings.hiddenEventButtons) ? p.settings.hiddenEventButtons : [];
    s.patients[id] = p;
  }

  if (!s.patients[s.currentPatientId]) s.currentPatientId = Object.keys(s.patients)[0];
  return s;
}

function loadState(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultState();
    return normalizeState(JSON.parse(raw));
  } catch (e){
    console.warn('Не удалось загрузить состояние:', e);
    return defaultState();
  }
}

function save(){
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch (e){
    console.warn('Не удалось сохранить:', e);
    const now = Date.now();
    if (!save._warnTs || now - save._warnTs > 30000){
      save._warnTs = now;
      showToast('Не удалось сохранить: память браузера переполнена. Сделайте копию данных во вкладке «Данные»', 'error');
    }
  }
  dailySnapshot();
}

/* ---------- резервные снапшоты и напоминания ---------- */

const SNAP_KEY = 'cc_snapshots';
let snapDay = null;

function dailySnapshot(){
  const k = todayKey(new Date());
  if (snapDay === k) return;
  snapDay = k;
  try {
    const list = JSON.parse(localStorage.getItem(SNAP_KEY) || '[]');
    const kept = list.filter(s => s.day !== k);
    kept.push({ day: k, ts: Date.now(), state: state });
    while (kept.length > 14) kept.shift();
    localStorage.setItem(SNAP_KEY, JSON.stringify(kept));
  } catch (e){}
}

function markExport(){
  try { localStorage.setItem('cc_lastExport', String(Date.now())); } catch (e){}
}

function backupReminderHtml(){
  if (state.ui.activeTab === 'data') return '';
  const hasData = Object.values(state.patients).some(p =>
    (p.events && p.events.length) || (p.pressure && p.pressure.length) ||
    (p.sugar && p.sugar.length) || (p.medLog && Object.keys(p.medLog).length));
  if (!hasData) return '';
  const last = parseInt(localStorage.getItem('cc_lastExport'), 10);
  if (!isNaN(last)){
    const days = Math.floor((Date.now() - last) / 86400000);
    if (days <= 7) return '';
    return '<div class="alert warn backup-banner">💾 Резервная копия не делалась ' + days + ' дн. <button class="btn sm primary" data-action="goBackup">Сделать копию</button></div>';
  }
  return '<div class="alert warn backup-banner">💾 Резервная копия ещё не делалась. <button class="btn sm primary" data-action="goBackup">Сделать копию</button></div>';
}

/* ============================ MODAL ============================ */

const modalRoot = document.getElementById('modalRoot');
let modalResolve = null;

function openModal(html){
  modalRoot.innerHTML = '<div class="backdrop"><div class="modal" role="dialog">' + html + '</div></div>';
  modalRoot.classList.add('open');
  document.body.classList.add('no-scroll');
}

function closeModal(){
  modalRoot.classList.remove('open');
  modalRoot.innerHTML = '';
  document.body.classList.remove('no-scroll');
}

function resolveModal(val){
  const r = modalResolve;
  modalResolve = null;
  closeModal();
  if (r) r(val);
}

modalRoot.addEventListener('click', (e) => {
  if (e.target.classList.contains('backdrop')){ resolveModal(false); return; }
  if (e.target.closest('[data-modal-ok]')){ resolveModal(true); return; }
  const ch = e.target.closest('[data-choice]');
  if (ch){ resolveModal(ch.dataset.choice); return; }
  if (e.target.closest('[data-modal-cancel]') || e.target.closest('[data-close]')){ resolveModal(false); }
});

function modalConfirm(message, opts){
  opts = opts || {};
  return new Promise((resolve) => {
    modalResolve = resolve;
    openModal(
      '<div class="modal-body">' + escapeHtml(message) + '</div>' +
      '<div class="modal-actions">' +
        '<button class="btn" data-modal-cancel>' + escapeHtml(opts.cancelText || 'Отмена') + '</button>' +
        '<button class="btn ' + (opts.danger ? 'danger' : 'primary') + '" data-modal-ok>' + escapeHtml(opts.okText || 'OK') + '</button>' +
      '</div>'
    );
  });
}

function modalChoice(message, choices){
  return new Promise((resolve) => {
    modalResolve = resolve;
    openModal(
      '<div class="modal-body">' + escapeHtml(message) + '</div>' +
      '<div class="modal-actions col">' +
        choices.map((c, i) =>
          '<button class="btn ' + (c.danger ? 'danger' : (i === 0 ? 'primary' : '')) + '" data-choice="' + escapeHtml(c.value) + '">' +
            escapeHtml(c.label) +
          '</button>'
        ).join('') +
        '<button class="btn" data-modal-cancel>Отмена</button>' +
      '</div>'
    );
  });
}

/* ============================ SVG CHART ============================ */

function svgChart(series, opts){
  opts = opts || {};
  const w = opts.w || 640, h = opts.h || 220;
  const padL = 42, padR = 14, padT = 16, padB = 28;
  const all = series.reduce((acc, s) => acc.concat(s.points), []);
  if (!all.length) return '<div class="empty">Нет данных за период</div>';

  const tAll = all.map(p => p.t);
  const vAll = all.map(p => p.v);
  let t0 = Math.min.apply(null, tAll);
  let t1 = Math.max.apply(null, tAll);
  if (t0 === t1){ t0 -= 43200000; t1 += 43200000; }

  let vMin = Math.min.apply(null, vAll);
  let vMax = Math.max.apply(null, vAll);
  if (vMin === vMax){ vMin -= 1; vMax += 1; }
  const span = vMax - vMin;
  const lo = (opts.yMin !== undefined) ? opts.yMin : vMin - span * 0.15;
  const hi = (opts.yMax !== undefined) ? opts.yMax : vMax + span * 0.15;

  const X = t => padL + (t - t0) / (t1 - t0) * (w - padL - padR);
  const Y = v => padT + (1 - (v - lo) / (hi - lo)) * (h - padT - padB);

  let grid = '';
  const steps = 4;
  for (let i = 0; i <= steps; i++){
    const v = lo + (hi - lo) * i / steps;
    const y = Y(v).toFixed(1);
    grid += '<line x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y + '" stroke="currentColor" stroke-opacity="0.12"/>';
    grid += '<text x="' + (padL - 6) + '" y="' + (Number(y) + 3.5) + '" text-anchor="end" font-size="10" fill="currentColor" fill-opacity="0.6">' + fmtNum(v) + '</text>';
  }

  let paths = '';
  series.forEach(s => {
    if (!s.points.length) return;
    const pts = s.points.slice().sort((a, b) => a.t - b.t);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
    paths += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach(p => {
      paths += '<circle cx="' + X(p.t).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="2.6" fill="' + s.color + '"/>';
    });
  });

  const fd = t => { const d = new Date(t); return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1); };
  let xl = '';
  xl += '<text x="' + padL + '" y="' + (h - 8) + '" font-size="10" fill="currentColor" fill-opacity="0.6">' + fd(t0) + '</text>';
  xl += '<text x="' + (w - padR) + '" y="' + (h - 8) + '" text-anchor="end" font-size="10" fill="currentColor" fill-opacity="0.6">' + fd(t1) + '</text>';

  return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="chart" preserveAspectRatio="xMidYMid meet">' +
    grid + paths + xl + '</svg>';
}

/* ============================ TAB: PRESSURE ============================ */

function pressureClass(sys, dia){
  if (sys >= 180 || dia >= 110) return 'crit';
  if (sys >= 140 || dia >= 90) return 'high';
  if (sys >= 130 || dia >= 85) return 'warn';
  return 'ok';
}

function pressureLabel(cls){
  return { ok:'Норма', warn:'Выше нормы', high:'Высокое', crit:'Критическое' }[cls] || '';
}

function renderPressure(host){
  const p = currentPatient();
  const days = state.ui.pressurePeriod || 7;
  const from = periodStart(days);
  const list = p.pressure.filter(x => x.ts >= from).sort((a, b) => b.ts - a.ts);

  /* графики */
  const byDay = new Map();
  p.pressure.filter(x => x.ts >= from).forEach(r => {
    const k = todayKey(new Date(r.ts));
    if (!byDay.has(k)) byDay.set(k, { sys: [], dia: [] });
    byDay.get(k).sys.push(r.sys);
    byDay.get(k).dia.push(r.dia);
  });
  const sysPts = [], diaPts = [];
  byDay.forEach((v, k) => {
    const t = new Date(k + 'T12:00:00').getTime();
    sysPts.push({ t: t, v: avg(v.sys) });
    diaPts.push({ t: t, v: avg(v.dia) });
  });

  const pressureChart = svgChart(
    [{ name: 'Верхнее', color: '#ef4444', points: sysPts }, { name: 'Нижнее', color: '#3b82f6', points: diaPts }],
    { yMin: 40, yMax: 200 }
  );

  host.innerHTML =
    '<section class="card">' +
      '<div class="card-head"><h2>Измерение давления</h2></div>' +
      '<div class="form-row">' +
        '<label class="field"><span>Верхнее</span><input id="pSys" type="number" inputmode="numeric" placeholder="120"></label>' +
        '<label class="field"><span>Нижнее</span><input id="pDia" type="number" inputmode="numeric" placeholder="80"></label>' +
        '<label class="field"><span>Пульс</span><input id="pPulse" type="number" inputmode="numeric" placeholder="70"></label>' +
      '</div>' +
      '<div class="btn-row"><button class="btn primary" data-action="addPressure">Сохранить измерение</button></div>' +
    '</section>' +

    '<section class="card">' +
      '<div class="card-head"><h2>Среднее давление по дням</h2></div>' +
      pressureChart +
      legend([{ name: 'Верхнее', color: '#ef4444' }, { name: 'Нижнее', color: '#3b82f6' }]) +
    '</section>' +

    '<section class="card">' +
      '<div class="card-head">' +
        '<h2>История измерений</h2>' +
        '<select class="inline-select" data-change="pressurePeriod">' +
          PERIODS.map(d => '<option value="' + d + '"' + (days === d ? ' selected' : '') + '>' + d + ' дн.</option>').join('') +
        '</select>' +
      '</div>' +
      '<div class="list">' + renderPressureList(list, state.ui.pressureListExpanded) + '</div>' +
    '</section>';
}

function renderPressureList(list, expanded){
  if (!list.length) return '<div class="empty">Нет измерений за период</div>';
  const rows = (expanded ? list : list.slice(0, 3)).map(r => {
    const cls = pressureClass(r.sys, r.dia);
    return '<div class="row">' +
      '<span class="row-icon">❤️</span>' +
      '<div class="row-main">' +
        '<div class="row-title"><span class="row-val">' + r.sys + '/' + r.dia + '</span>' +
          (r.pulse ? ' <span class="muted">пульс ' + r.pulse + '</span>' : '') +

  }

}

function submitPressure(){
  const p = currentPatient();
  const sysEl = document.getElementById('pSys');
  const diaEl = document.getElementById('pDia');
  const pulseEl = document.getElementById('pPulse');

  const sys = parseFloat(String(sysEl.value).replace(',', '.'));
  const dia = parseFloat(String(diaEl.value).replace(',', '.'));
  const pulseRaw = String(pulseEl.value).trim();
  const pulse = pulseRaw === '' ? null : parseInt(pulseRaw, 10);

  const errs = [];
  if (!(sys >= 60 && sys <= 260)) errs.push('Верхнее давление должно быть от 60 до 260');
  if (!(dia >= 30 && dia <= 160)) errs.push('Нижнее давление должно быть от 30 до 160');
  if (!isNaN(sys) && !isNaN(dia) && sys <= dia) errs.push('Верхнее должно быть больше нижнего');
  if (pulse !== null && (isNaN(pulse) || pulse < 30 || pulse > 220)) errs.push('Пульс должен быть от 30 до 220');

  if (errs.length){ showToast(errs.join('. '), 'error'); return; }

  p.pressure.push({ id: uid(), ts: Date.now(), sys: sys, dia: dia, pulse: pulse });
  save();
  renderView();

  if (sys >= 180 || dia >= 110){
    openModal(
      '<h3 class="danger-title">🚨 Экстренное предупреждение</h3>' +
      '<div class="modal-body">Показатели давления ' + sys + '/' + dia + ' критически высоки.\n\n' +
      'Необходимо срочно связаться с врачом или вызвать скорую помощь. Не оставляйте человека одного.</div>' +
      '<div class="modal-actions"><button class="btn danger" data-modal-cancel>Понятно</button></div>'
    );
  } else {
    showToast('Измерение сохранено', 'ok');
  }
}

  }

  host.innerHTML =

/* ============================ STATISTICS ============================ */

function computeStats(days, fromTs, toTs){
  const p = currentPatient();
  const from = (fromTs != null) ? fromTs : periodStart(days);
  const endTs = (toTs != null) ? toTs : null;
  const inRange = (ts) => ts >= from && (endTs === null || ts <= endTs);

  const ev = p.events.filter(e => inRange(e.ts));
  const pr = p.pressure.filter(e => inRange(e.ts));
  const sg = p.sugar.filter(e => inRange(e.ts));

  const episodes = ev.filter(e => e.type === 'episode');
  const bySlot = { morning: 0, day: 0, evening: 0, night: 0 };
  episodes.forEach(e => {
    const h = new Date(e.ts).getHours();
    if (h >= 5 && h < 12) bySlot.morning++;
    else if (h >= 12 && h < 17) bySlot.day++;
    else if (h >= 17 && h < 22) bySlot.evening++;
    else bySlot.night++;
  });

  const dry = ev.filter(e => e.type === 'dry').length;
  const wet = ev.filter(e => e.type === 'wet').length;
  const good = ev.filter(e => e.type === 'good').length;
  const bad = ev.filter(e => e.type === 'bad').length;
  const falls = ev.filter(e => e.type === 'fall').length;
  const headaches = ev.filter(e => e.type === 'headache').length;
  const refusals = ev.filter(e => e.type === 'refuse').length;

  const avgSys = pr.length ? avg(pr.map(x => x.sys)) : null;
  const avgDia = pr.length ? avg(pr.map(x => x.dia)) : null;
  const highCount = pr.filter(x => x.sys >= 140 || x.dia >= 90).length;
  const critCount = pr.filter(x => x.sys >= 180 || x.dia >= 110).length;

  const avgSugar = sg.length ? avg(sg.map(x => Number(x.value))) : null;
  const lowSugar = sg.filter(x => Number(x.value) <= 3.5).length;
  const highSugar = sg.filter(x => Number(x.value) >= 15).length;

  const temps = ev.filter(e => e.type === 'temp' && e.value != null).map(e => Number(e.value));
  const maxTemp = temps.length ? Math.max.apply(null, temps) : null;

  const weights = ev.filter(e => e.type === 'weight' && e.value != null)
    .sort((a, b) => a.ts - b.ts)
    .map(e => Number(e.value));
  const weightFirst = weights.length ? weights[0] : null;
  const weightLast = weights.length ? weights[weights.length - 1] : null;
  const weightDelta = (weightFirst !== null && weightLast !== null) ? (weightLast - weightFirst) : null;

  const scheduled = p.meds.filter(m => m.slots && m.slots.some(s => s !== 'asneeded'));
  let missed = 0, totalDoses = 0;
  const start = new Date(from);
  start.setHours(0, 0, 0, 0);
  const today = (endTs !== null) ? new Date(endTs) : new Date();
  today.setHours(0, 0, 0, 0);
    for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)){
    const key = todayKey(d);
    const log = p.medLog[key] || {};
    const dayStart = d.getTime();
    scheduled.forEach(m => {
      if (m.created){
        const medStart = new Date(m.created);
        medStart.setHours(0, 0, 0, 0);
        if (dayStart < medStart.getTime()) return;
      }
      if (m.status === 'stopped' && m.stoppedTs != null){
        const stopDay = new Date(m.stoppedTs);
        stopDay.setHours(0, 0, 0, 0);
        if (dayStart > stopDay.getTime()) return;
      }
      m.slots.forEach(slotId => {
        if (slotId === 'asneeded') return;
        totalDoses++;
        if (!log[slotId + '|' + m.id]) missed++;
      });
    });
  }

  return {
    days: days,
    from: from,
    eventsTotal: ev.length,
    episodes: episodes.length,
    bySlot: bySlot,
    dry: dry, wet: wet, good: good, bad: bad,
    falls: falls, headaches: headaches, refusals: refusals,
    pressureCount: pr.length,
    avgSys: avgSys, avgDia: avgDia,
    highCount: highCount, critCount: critCount,
    sugarCount: sg.length, avgSugar: avgSugar,
    lowSugar: lowSugar, highSugar: highSugar,
    maxTemp: maxTemp,
    weightFirst: weightFirst, weightLast: weightLast, weightDelta: weightDelta,
    missedMeds: missed, totalDoses: totalDoses
  };
}

function statCard(label, value, sub){
  return '<div class="stat">' +
    '<div class="stat-label">' + escapeHtml(label) + '</div>' +
    '<div class="stat-value">' + escapeHtml(value) + '</div>' +
    (sub ? '<div class="stat-sub">' + escapeHtml(sub) + '</div>' : '') +
  '</div>';
}

function renderStats(host){

  const avgP = (st.avgSys !== null) ? Math.round(st.avgSys) + '/' + Math.round(st.avgDia) : '—';
  const weightSub = (st.weightDelta !== null)
    ? ((st.weightDelta > 0 ? '+' : '') + fmtNum(st.weightDelta) + ' кг')
    : 'нет данных';
  const weightVal = (st.weightLast !== null) ? fmtNum(st.weightLast) + ' кг' : '—';

  const byDayW = new Map();
  p.events.filter(e => e.type === 'weight' && e.ts >= st.from && e.value != null).forEach(e => {
    const k = todayKey(new Date(e.ts));
    if (!byDayW.has(k)) byDayW.set(k, []);
    byDayW.get(k).push(Number(e.value));
  });
  const weightPts = [];
  byDayW.forEach((v, k) => weightPts.push({ t: new Date(k + 'T12:00:00').getTime(), v: avg(v) }));
  const weightChart = svgChart([{ name: 'Вес', color: '#22c55e', points: weightPts }], {});

  host.innerHTML =
    '<section class="card">' +
      '<div class="card-head">' +
        '<h2>Статистика · ' + escapeHtml(p.name) + '</h2>' +
        '<select class="inline-select" data-change="statsPeriod">' +
          PERIODS.map(d => '<option value="' + d + '"' + (days === d ? ' selected' : '') + '>' + d + ' дн.</option>').join('') +
        '</select>' +
      '</div>' +
      '<div class="stat-grid">' +
        statCard('Всего событий', String(st.eventsTotal), 'за ' + days + ' дн.') +
        statCard('Эпизоды', String(st.episodes),
          'утро ' + st.bySlot.morning + ' · день ' + st.bySlot.day + ' · вечер ' + st.bySlot.evening + ' · ночь ' + st.bySlot.night) +
        statCard('Сухо / Мокро', st.dry + ' / ' + st.wet, 'записано событий') +
        statCard('Среднее давление', avgP, st.pressureCount + ' измерений') +
        statCard('Выше 140/90', String(st.highCount), st.critCount ? 'критических: ' + st.critCount : 'критических нет') +
        statCard('Самочувствие', st.good + ' / ' + st.bad, 'хорошо / плохо') +
        statCard('Пропущено приёмов', String(st.missedMeds), 'из ' + st.totalDoses + ' по плану') +
        statCard('Вес', weightVal, weightSub) +
        statCard('Макс. температура', st.maxTemp !== null ? fmtNum(st.maxTemp) + ' °C' : '—', 'за период') +
        statCard('Сахар (сред.)', st.avgSugar !== null ? fmtNum(st.avgSugar) + ' ммоль/л' : '—',
          'низких: ' + st.lowSugar + ' · высоких: ' + st.highSugar) +
      '</div>' +
    '</section>' +
    '<section class="card">' +
      '<div class="card-head"><h2>Прочие события</h2></div>' +
      '<div class="stat-grid">' +
        statCard('Падения', String(st.falls), '') +
        statCard('Головные боли', String(st.headaches), '') +
        statCard('Отказ от еды', String(st.refusals), '') +
      '</div>' +
    '</section>' +

    '<section class="card">' +
      '<div class="card-head"><h2>Динамика веса</h2></div>' +
      weightChart +
    '</section>';
}

/* ============================ REPORT ============================ */

function pressureMark(cls){
  return { ok:'🟢 норма', warn:'🟡 повышенное', high:'🟡 высокое', crit:'🔴 критическое' }[cls] || '';
}

function sugarMark(cls){
  return { ok:'🟢 норма', warn:'🟡 низкий', high:'🟡 высокий', crit:'🔴 критический' }[cls] || '';
}

function sparkline(vals){
  if (!vals || vals.length < 2) return '';
  const blocks = '▁▂▃▄▅▆▇█';
  const mn = Math.min.apply(null, vals);
  const mx = Math.max.apply(null, vals);
  const span = (mx - mn) || 1;
  return vals.map(v => blocks[Math.round((v - mn) / span * (blocks.length - 1))]).join('');
}

function buildReport(days){
  const p = currentPatient();
  const rng = reportRange(days);
  const st = computeStats(rng.span, rng.from, rng.to);
  const to = rng.to;
  const L = [];

  const ev = p.events.filter(e => e.ts >= st.from && e.ts <= to);
  const pr = p.pressure.filter(r => r.ts >= st.from && r.ts <= to).sort((a, b) => a.ts - b.ts);
  const sg = p.sugar.filter(r => r.ts >= st.from && r.ts <= to).sort((a, b) => a.ts - b.ts);
  const wts = ev.filter(e => e.type === 'weight' && e.value != null).sort((a, b) => a.ts - b.ts);
  const tmps = ev.filter(e => e.type === 'temp' && e.value != null).sort((a, b) => a.ts - b.ts);

  const G_S = p.goalSys || 140;
  const G_D = p.goalDia || 90;
  const inGoal = pr.filter(r => r.sys < G_S && r.dia < G_D).length;
  const critList = pr.filter(r => r.sys >= 180 || r.dia >= 110);
  const lowSugarList = sg.filter(r => Number(r.value) <= 3.5);
  const hiSugarList = sg.filter(r => Number(r.value) >= 15);
  const prevList = p.pressure.filter(r => r.ts >= st.from - rng.span * 86400000 && r.ts < st.from);

  L.push('ОТЧЁТ О НАБЛЮДЕНИИ');
  L.push('═════════════════════════════════════');
  L.push('Пациент: ' + p.name);
  L.push('Период: ' + fmtDate(st.from) + ' — ' + fmtDate(to) + ' (' + rng.span + ' дн.)');
  L.push('Сформирован: ' + fmtDateTime(to));
  L.push('');

  L.push('1. СВОДКА: ЧТО ТРЕБУЕТ ВНИМАНИЯ');
  const flags = [];
  if (critList.length){
    flags.push('⚠️ Критическое АД (≥180/110): ' + critList.length + ' раз — ' + critList.map(r => fmtDateTime(r.ts) + ' (' + r.sys + '/' + r.dia + ')').join('; '));
  }
  if (lowSugarList.length){
    flags.push('⚠️ Гипогликемия (≤3,5): ' + lowSugarList.length + ' раз — ' + lowSugarList.map(r => fmtDateTime(r.ts) + ' (' + fmtNum(r.value) + ')').join('; '));
  }
  if (hiSugarList.length){
    flags.push('⚠️ Гипергликемия (≥15): ' + hiSugarList.length + ' раз — ' + hiSugarList.map(r => fmtDateTime(r.ts) + ' (' + fmtNum(r.value) + ')').join('; '));
  }
  if (st.falls) flags.push('⚠️ Падений: ' + st.falls);
  if (st.missedMeds) flags.push('⚠️ Пропущено приёмов лекарств: ' + st.missedMeds + ' из ' + st.totalDoses);
  if (pr.length){
    flags.push('📊 Среднее АД: ' + Math.round(st.avgSys) + '/' + Math.round(st.avgDia) + ' мм рт. ст. — в цели (<' + G_S + '/' + G_D + ') ' + inGoal + ' из ' + pr.length + ' (' + Math.round(inGoal / pr.length * 100) + '%)');
    if (pr.length >= 4){
      const half = Math.floor(pr.length / 2);
      const dd = avg(pr.slice(half).map(r => r.sys)) - avg(pr.slice(0, half).map(r => r.sys));
      flags.push('📈 Динамика верхнего давления: ' + (dd >= 5 ? 'рост к концу периода ↑' : (dd <= -5 ? 'снижение ↓' : 'стабильно →')));
    }
    if (prevList.length){
      const dp = st.avgSys - avg(prevList.map(r => r.sys));
      flags.push('🗓 Прошлые ' + rng.span + ' дн.: среднее ' + Math.round(avg(prevList.map(r => r.sys))) + '/' + Math.round(avg(prevList.map(r => r.dia))) + ' — ' + (Math.abs(dp) >= 3 ? (dp > 0 ? 'выше на +' : 'ниже на −') + Math.round(Math.abs(dp)) : 'на том же уровне'));
    }
  }
  if (!flags.length) flags.push('✅ Тревожных отклонений за период не зафиксировано');
  flags.forEach(f => L.push('   ' + f));
  L.push('');

  if (p.note && p.note.trim()){
    L.push('КОНТЕКСТ О ПАЦИЕНТЕ:');
    L.push(p.note.trim());
    L.push('');
  }

  let n = 1;
  const sectT = t => { n++; L.push(n + '. ' + t); };
  if (pr.length){
    sectT('АРТЕРИАЛЬНОЕ ДАВЛЕНИЕ (АД) И ПУЛЬС');
    const sysAll = pr.map(r => r.sys);
    const diaAll = pr.map(r => r.dia);
    const puAll = pr.filter(r => r.pulse).map(r => r.pulse);
    const variab = Math.max.apply(null, sysAll) - Math.min.apply(null, sysAll);
    L.push('   Цель: <' + G_S + '/' + G_D + ' · достигнуто ' + inGoal + ' из ' + pr.length + ' (' + Math.round(inGoal / pr.length * 100) + '%)');
    L.push('   Среднее: ' + Math.round(st.avgSys) + '/' + Math.round(st.avgDia) + ' · диапазон ' + Math.min.apply(null, sysAll) + '–' + Math.max.apply(null, sysAll) + ' / ' + Math.min.apply(null, diaAll) + '–' + Math.max.apply(null, diaAll) + ' · разброс верхнего ' + variab + ' ед.' + (variab >= 40 ? ' — значительные скачки' : ''));
    if (puAll.length) L.push('   Пульс: средний ' + Math.round(avg(puAll)) + ', диапазон ' + Math.min.apply(null, puAll) + '–' + Math.max.apply(null, puAll) + ' уд/мин');
    if (pr.length >= 2) L.push('   Динамика (слева — раньше): ' + sparkline(sysAll));
    L.push('   Измерения:');
    pr.forEach(r => {
      L.push('     ' + fmtDateTime(r.ts) + '  ' + r.sys + '/' + r.dia + (r.pulse ? '  пульс ' + r.pulse : '') + '  ' + pressureMark(pressureClass(r.sys, r.dia)));
    });
  }
  L.push('');

  L.push('3. ГЛЮКОЗА КРОВИ');
  if (sg.length){
    const vals = sg.map(r => Number(r.value));
    L.push('   Средний уровень: ' + fmtNum(st.avgSugar) + ' ммоль/л · диапазон ' + fmtNum(Math.min.apply(null, vals)) + ' – ' + fmtNum(Math.max.apply(null, vals)));
    L.push('   Измерения:');
    sg.forEach(r => {
      L.push('     ' + fmtDateTime(r.ts) + '  ' + fmtNum(r.value) + ' ммоль/л  ' + sugarMark(sugarClass(Number(r.value))));
    });
  }
  L.push('');

  if (wts.length || tmps.length){
    sectT('ВЕС И ТЕМПЕРАТУРА');
    if (wts.length){
    L.push('   Вес: ' + fmtNum(st.weightFirst) + ' кг → ' + fmtNum(st.weightLast) + ' кг' +
      (st.weightDelta !== null ? ' (динамика ' + (st.weightDelta > 0 ? '+' : '') + fmtNum(st.weightDelta) + ' кг)' : '') + ', измерений ' + wts.length);
    wts.forEach(e => L.push('     ' + fmtDateTime(e.ts) + '  ' + fmtNum(e.value) + ' кг'));
  } else {
    L.push('   Вес: не вносился.');
  }
  if (tmps.length){
    L.push('   Температура: измерений ' + tmps.length + ', максимальная ' + fmtNum(st.maxTemp) + ' °C');
    tmps.forEach(e => L.push('     ' + fmtDateTime(e.ts) + '  ' + fmtNum(e.value) + ' °C'));
  } else {
    L.push('   Температура: не измерялась.');
  }
  }
  L.push('');

  if (st.eventsTotal){
    sectT('СОБЫТИЯ И САМОЧУВСТВИЕ');
    const toilets = ev.filter(e => e.type === 'toilet').length;
    const cnt = [];
    if (toilets) cnt.push('туалет: ' + toilets);
    if (st.dry || st.wet) cnt.push('сухо/мокро: ' + st.dry + '/' + st.wet);
    if (st.good || st.bad) cnt.push('самочувствие хорошо/плохо: ' + st.good + '/' + st.bad);
    if (st.falls) cnt.push('падения: ' + st.falls);
    if (st.headaches) cnt.push('головная боль: ' + st.headaches);
    if (st.refusals) cnt.push('отказ от еды: ' + st.refusals);
    L.push('   Всего записей: ' + st.eventsTotal + ' · эпизодов: ' + st.episodes +
      (st.episodes ? ' (утро ' + st.bySlot.morning + ', день ' + st.bySlot.day + ', вечер ' + st.bySlot.evening + ', ночь ' + st.bySlot.night + ')' : ''));
    L.push('   ' + (cnt.join(' · ') || 'прочих событий нет'));
  }
  L.push('');

  const byDay = new Map();
  function bucket(ts){
    const k = todayKey(new Date(ts));
    if (!byDay.has(k)) byDay.set(k, { pr: [], sg: [], ep: 0, toilet: 0, dry: 0, wet: 0, falls: 0, good: 0, bad: 0, refuse: 0, headache: 0, temp: null });
    return byDay.get(k);
  }
  pr.forEach(r => bucket(r.ts).pr.push(r));
  sg.forEach(r => bucket(r.ts).sg.push(r));
  ev.forEach(e => {
    const b = bucket(e.ts);
    if (e.type === 'episode') b.ep++;
    else if (e.type === 'toilet') b.toilet++;
    else if (e.type === 'dry') b.dry++;
    else if (e.type === 'wet') b.wet++;
    else if (e.type === 'fall') b.falls++;
    else if (e.type === 'good') b.good++;
    else if (e.type === 'bad') b.bad++;
    else if (e.type === 'refuse') b.refuse++;
    else if (e.type === 'headache') b.headache++;
    else if (e.type === 'temp' && e.value != null){
      const v = Number(e.value);
      if (b.temp === null || v > b.temp) b.temp = v;
    }
  });
  const dayItems = [];
  for (let d = new Date(st.from); d.getTime() <= to; d.setDate(d.getDate() + 1)){
    const k = todayKey(d);
    dayItems.push({ k: k, b: byDay.get(k) || null });
  }
  const dayLines = [];
  let run = null;
  dayItems.forEach((it, idx) => {
    if (it.b){
      if (run){
        const prevK = dayItems[idx - 1].k;
        dayLines.push('   ' + (run === prevK ? prevK : run + '–' + prevK) + ' — данные не вносились');
        run = null;
      }
      const b = it.b;
      const parts = [];
      if (b.pr.length) parts.push('АД ср. ' + Math.round(avg(b.pr.map(x => x.sys))) + '/' + Math.round(avg(b.pr.map(x => x.dia))) + ', ' + b.pr.length + ' изм.');
      if (b.sg.length) parts.push('глюкоза ср. ' + fmtNum(avg(b.sg.map(x => Number(x.value)))));
      if (b.ep) parts.push('эпизоды ' + b.ep);
      if (b.toilet) parts.push('туалет ' + b.toilet);
      if (b.dry || b.wet) parts.push('сухо/мокро ' + b.dry + '/' + b.wet);
      if (b.good || b.bad) parts.push('самочувствие ' + b.good + '/' + b.bad);
      if (b.falls) parts.push('падения ' + b.falls);
      if (b.refuse) parts.push('отказ от еды ' + b.refuse);
      if (b.headache) parts.push('головная боль ' + b.headache);
      if (b.temp !== null) parts.push('макс. t ' + fmtNum(b.temp) + ' °C');
      dayLines.push('   ' + fmtDate(new Date(it.k + 'T12:00:00').getTime()).slice(0, 5) + ' — ' + (parts.length ? parts.join(' · ') : 'без значимых записей'));
    } else if (run === null){
      run = it.k;
    }
  });
  if (run){
    const lastK = dayItems[dayItems.length - 1].k;
    dayLines.push('   ' + (run === lastK ? run : run + '–' + lastK) + ' — данные не вносились');
  }
  if (dayLines.length){
    sectT('ПО ДНЯМ');
    dayLines.forEach(x => L.push(x));
    L.push('');
  }

  const activeMeds = p.meds.filter(m => m.status !== 'stopped');
  const medChanges = (p.medChanges || []).filter(c => c.ts >= st.from && c.ts <= to);
  if (activeMeds.length || medChanges.length){
    sectT('ЛЕКАРСТВА');
    if (activeMeds.length){
      L.push('   План приёма:');
      activeMeds.forEach(m => {
        const labels = (m.slots || [m.slot]).map(id => (SLOTS.find(s => s.id === id) || { label: id }).label).join(', ');
        L.push('   ' + labels + ': ' + m.name + (m.dose ? ' (' + m.dose + ')' : ''));
      });
    } else {
      L.push('   Действующих препаратов нет.');
    }
    L.push('   Отметок «Принято» за период: ' + (st.totalDoses - st.missedMeds) + ' из ' + st.totalDoses + ' · пропущено: ' + st.missedMeds + ' (пропуски считаются по действующим препаратам)');
    const actNames = { stopped: 'отменён', restarted: 'возобновлён', added: 'назначен' };
    if (medChanges.length){
      L.push('   Изменения за период:');
      medChanges.forEach(c => L.push('     ' + fmtDateTime(c.ts) + ' — ' + c.name + (c.dose ? ' (' + c.dose + ')' : '') + ': ' + (actNames[c.action] || c.action)));
    }
  } else {
    L.push('   План приёма не задан.');
  }
  L.push('');

  sectT('РЕКОМЕНДАЦИИ');
  const recs = [];
  if (critList.length) recs.push('🔴 Критические значения АД требуют немедленной консультации врача.');
  if (pr.length && inGoal === 0) recs.push('Все измерения выше целевого уровня — возможна неэффективность терапии, обсудите схему с врачом.');
  else if (pr.length && inGoal < pr.length) recs.push('Часть измерений выше цели — продолжайте контроль, обсудите с врачом при ухудшении.');
  if (lowSugarList.length) recs.push('Была гипогликемия — держите под рукой быстрые углеводы (сок, сахар).');
  if (hiSugarList.length) recs.push('Была гипергликемия — следите за питьём и питанием, обсудите с врачом.');
  if (st.falls) recs.push('Были падения — обсудите с врачом причину и безопасность передвижения.');
  const missing = [];
  if (!sg.length) missing.push('глюкоза');
  if (!wts.length) missing.push('вес');
  if (!tmps.length) missing.push('температура');
  if (missing.length) recs.push('Для полноты картины рекомендуется дополнить наблюдение: ' + missing.join(', ') + '.');
  if (!recs.length) recs.push('Показатели в пределах целевых значений — продолжайте текущее наблюдение.');
  recs.forEach(r => L.push('   • ' + r));
  L.push('');
  L.push('─────────────────────────────────────');
  L.push('Отчёт сформирован автоматически приложением «Компас заботы».');

  return L.join('\n');
}

  const G_D = p.goalDia || 90;
  const inGoal = pr.filter(r => r.sys < G_S && r.dia < G_D).length;
  const critList = pr.filter(r => r.sys >= 180 || r.dia >= 110);

  const rowCls = c => (c === 'crit' ? ' class="rep-crit"' : (c === 'warn' || c === 'high' ? ' class="rep-warn"' : ''));

  const H = [];
  H.push('<div class="report-doc">');
  H.push('<h3 class="rep-title">Отчёт о наблюдении</h3>');
  H.push('<p class="rep-meta">Пациент: <b>' + escapeHtml(p.name) + '</b> · Период: ' + fmtDate(st.from) + ' — ' + fmtDate(to) + ' (' + rng.span + ' дн.) · Сформирован: ' + fmtDateTime(to) + '</p>');

  H.push('<h4>1. Сводка: что требует внимания</h4>');
  H.push('<ul class="rep-flags">');
  let anyFlag = false;
  const flag = (cls, txt) => { H.push('<li class="' + cls + '">' + txt + '</li>'); anyFlag = true; };
  if (critList.length) flag('flag-crit', '⚠️ Критическое АД (≥180/110): ' + critList.length + ' раз — ' + critList.map(r => fmtDateTime(r.ts) + ' (' + r.sys + '/' + r.dia + ')').join('; '));
  if (lowSugarList.length) flag('flag-crit', '⚠️ Гипогликемия (≤3,5): ' + lowSugarList.length + ' раз — ' + lowSugarList.map(r => fmtDateTime(r.ts) + ' (' + fmtNum(r.value) + ')').join('; '));
  if (hiSugarList.length) flag('flag-crit', '⚠️ Гипергликемия (≥15): ' + hiSugarList.length + ' раз — ' + hiSugarList.map(r => fmtDateTime(r.ts) + ' (' + fmtNum(r.value) + ')').join('; '));
  if (st.falls) flag('flag-crit', '⚠️ Падений: ' + st.falls);
  if (st.missedMeds) flag('flag-warn', '⚠️ Пропущено приёмов лекарств: ' + st.missedMeds + ' из ' + st.totalDoses);
  if (pr.length){
    flag('flag-warn', '📊 Среднее АД: <b>' + Math.round(st.avgSys) + '/' + Math.round(st.avgDia) + '</b> мм рт. ст. — в цели (&lt;' + G_S + '/' + G_D + ') ' + inGoal + ' из ' + pr.length + ' (' + Math.round(inGoal / pr.length * 100) + '%)');
    if (pr.length >= 4){
      const half = Math.floor(pr.length / 2);
      const dd = avg(pr.slice(half).map(r => r.sys)) - avg(pr.slice(0, half).map(r => r.sys));
      flag('', '📈 Динамика верхнего давления: ' + (dd >= 5 ? 'рост к концу периода ↑' : (dd <= -5 ? 'снижение ↓' : 'стабильно →')));
    }
    if (prevList.length){
      const dp = st.avgSys - avg(prevList.map(r => r.sys));
      flag('', '🗓 Прошлые ' + rng.span + ' дн.: среднее <b>' + Math.round(avg(prevList.map(r => r.sys))) + '/' + Math.round(avg(prevList.map(r => r.dia))) + '</b> — ' + (Math.abs(dp) >= 3 ? (dp > 0 ? 'выше на +' : 'ниже на −') + Math.round(Math.abs(dp)) : 'на том же уровне'));
    }
  }
  if (!anyFlag) flag('flag-ok', '✅ Тревожных отклонений за период не зафиксировано');
  H.push('</ul>');

  if (p.note && p.note.trim()) H.push('<p class="rep-note"><b>Контекст:</b> ' + escapeHtml(p.note.trim()) + '</p>');

  let n = 1;
  const sect = t => { n++; H.push('<h4>' + n + '. ' + t + '</h4>'); };
  if (pr.length){
    sect('Артериальное давление (АД) и пульс');
    const sysAll = pr.map(r => r.sys);
    const diaAll = pr.map(r => r.dia);
    const puAll = pr.filter(r => r.pulse).map(r => r.pulse);
    const variab = Math.max.apply(null, sysAll) - Math.min.apply(null, sysAll);
    H.push('<p>Среднее <b>' + Math.round(st.avgSys) + '/' + Math.round(st.avgDia) + '</b> · диапазон ' + Math.min.apply(null, sysAll) + '–' + Math.max.apply(null, sysAll) + ' / ' + Math.min.apply(null, diaAll) + '–' + Math.max.apply(null, diaAll) + ' · разброс верхнего ' + variab + ' ед.' + (variab >= 40 ? ' — <b>значительные скачки</b>' : '') + '</p>');
    if (puAll.length) H.push('<p>Пульс: средний <b>' + Math.round(avg(puAll)) + '</b>, диапазон ' + Math.min.apply(null, puAll) + '–' + Math.max.apply(null, puAll) + ' уд/мин</p>');
    if (pr.length >= 2){
      const half = Math.floor(pr.length / 2);
      const dd = pr.length >= 4 ? (avg(pr.slice(half).map(r => r.sys)) - avg(pr.slice(0, half).map(r => r.sys))) : 0;
      const trend = pr.length >= 4 ? (dd >= 5 ? ' рост ↑' : (dd <= -5 ? ' снижение ↓' : ' стабильно →')) : '';
      H.push('<p>Динамика (слева — раньше): <span class="mono">' + sparkline(sysAll) + '</span>' + trend + '</p>');
    }
    H.push('<table class="rep-table"><thead><tr><th>Время</th><th>АД, мм рт. ст.</th><th>Пульс</th><th>Оценка</th></tr></thead><tbody>');
    pr.forEach(r => {
      H.push('<tr' + rowCls(pressureClass(r.sys, r.dia)) + '><td>' + fmtDateTime(r.ts) + '</td><td><b>' + r.sys + '/' + r.dia + '</b></td><td>' + (r.pulse || '—') + '</td><td>' + pressureMark(pressureClass(r.sys, r.dia)) + '</td></tr>');
    });
    H.push('</tbody></table>');
    if (prevList.length){
      const dp = st.avgSys - avg(prevList.map(r => r.sys));
      H.push('<p>Прошлые ' + rng.span + ' дн.: среднее <b>' + Math.round(avg(prevList.map(r => r.sys))) + '/' + Math.round(avg(prevList.map(r => r.dia))) + '</b> — ' + (Math.abs(dp) >= 3 ? (dp > 0 ? 'выше на +' : 'ниже на −') + Math.round(Math.abs(dp)) : 'на том же уровне') + '</p>');
    }
  }

  if (sg.length){
    sect('Глюкоза крови');
    H.push('<table class="rep-table"><thead><tr><th>Время</th><th>ммоль/л</th><th>Оценка</th></tr></thead><tbody>');
    sg.forEach(r => {
      H.push('<tr' + rowCls(sugarClass(Number(r.value))) + '><td>' + fmtDateTime(r.ts) + '</td><td><b>' + fmtNum(r.value) + '</b></td><td>' + sugarMark(sugarClass(Number(r.value))) + '</td></tr>');
    });
    H.push('</tbody></table>');
  }

  if (wts.length || tmps.length){
    sect('Вес и температура');
    if (wts.length){
    H.push('<p>Вес: <b>' + fmtNum(st.weightFirst) + ' → ' + fmtNum(st.weightLast) + ' кг</b>' + (st.weightDelta !== null ? ' (динамика ' + (st.weightDelta > 0 ? '+' : '') + fmtNum(st.weightDelta) + ' кг)' : '') + '</p>');
    H.push('<ul class="rep-list">' + wts.map(e => '<li>' + fmtDateTime(e.ts) + ' — ' + fmtNum(e.value) + ' кг</li>').join('') + '</ul>');
  } else H.push('<p class="rep-empty">Вес не вносился.</p>');
  if (tmps.length){
    H.push('<p>Температура: измерений ' + tmps.length + ', максимальная <b>' + fmtNum(st.maxTemp) + ' °C</b></p>');
    H.push('<ul class="rep-list">' + tmps.map(e => '<li>' + fmtDateTime(e.ts) + ' — ' + fmtNum(e.value) + ' °C</li>').join('') + '</ul>');
  } else H.push('<p class="rep-empty">Температура не измерялась.</p>');
  }

  if (st.eventsTotal){
    sect('События и самочувствие');
    const toilets = ev.filter(e => e.type === 'toilet').length;
    const cnt = [];
    if (toilets) cnt.push('туалет: ' + toilets);
    if (st.dry || st.wet) cnt.push('сухо/мокро: ' + st.dry + '/' + st.wet);
    if (st.good || st.bad) cnt.push('самочувствие хорошо/плохо: ' + st.good + '/' + st.bad);
    if (st.falls) cnt.push('падения: ' + st.falls);
    if (st.headaches) cnt.push('головная боль: ' + st.headaches);
    if (st.refusals) cnt.push('отказ от еды: ' + st.refusals);
    H.push('<p>Всего записей: ' + st.eventsTotal + ' · эпизодов: ' + st.episodes + (st.episodes ? ' (утро ' + st.bySlot.morning + ', день ' + st.bySlot.day + ', вечер ' + st.bySlot.evening + ', ночь ' + st.bySlot.night + ')' : '') + '</p>');
    H.push('<p>' + (cnt.join(' · ') || 'прочих событий нет') + '</p>');
  }

  const byDay = new Map();
  function bucket(ts){
    const k = todayKey(new Date(ts));
    if (!byDay.has(k)) byDay.set(k, { pr: [], sg: [], ep: 0, toilet: 0, dry: 0, wet: 0, falls: 0, good: 0, bad: 0, refuse: 0, headache: 0, temp: null });
    return byDay.get(k);
  }
  pr.forEach(r => bucket(r.ts).pr.push(r));
  sg.forEach(r => bucket(r.ts).sg.push(r));
  ev.forEach(e => {
    const b = bucket(e.ts);
    if (e.type === 'episode') b.ep++;
    else if (e.type === 'toilet') b.toilet++;
    else if (e.type === 'dry') b.dry++;
    else if (e.type === 'wet') b.wet++;
    else if (e.type === 'fall') b.falls++;
    else if (e.type === 'good') b.good++;
    else if (e.type === 'bad') b.bad++;
    else if (e.type === 'refuse') b.refuse++;
    else if (e.type === 'headache') b.headache++;
    else if (e.type === 'temp' && e.value != null){
      const v = Number(e.value);
      if (b.temp === null || v > b.temp) b.temp = v;
    }
  });
  const dayItems = [];
  for (let d = new Date(st.from); d.getTime() <= to; d.setDate(d.getDate() + 1)){
    const k = todayKey(d);
    dayItems.push({ k: k, b: byDay.get(k) || null });
  }
  const dayHtml = [];
  let run = null;
  dayItems.forEach((it, idx) => {
    if (it.b){
      if (run){
        const prevK = dayItems[idx - 1].k;
        dayHtml.push('<li>' + (run === prevK ? prevK : run + '–' + prevK) + ' — данные не вносились</li>');
        run = null;
      }
      const b = it.b;
      const parts = [];
      if (b.pr.length) parts.push('АД ср. <b>' + Math.round(avg(b.pr.map(x => x.sys))) + '/' + Math.round(avg(b.pr.map(x => x.dia))) + '</b>, ' + b.pr.length + ' изм.');
      if (b.sg.length) parts.push('глюкоза ср. ' + fmtNum(avg(b.sg.map(x => Number(x.value)))));
      if (b.ep) parts.push('эпизоды ' + b.ep);
      if (b.toilet) parts.push('туалет ' + b.toilet);
      if (b.dry || b.wet) parts.push('сухо/мокро ' + b.dry + '/' + b.wet);
      if (b.good || b.bad) parts.push('самочувствие ' + b.good + '/' + b.bad);
      if (b.falls) parts.push('падения ' + b.falls);
      if (b.refuse) parts.push('отказ от еды ' + b.refuse);
      if (b.headache) parts.push('головная боль ' + b.headache);
      if (b.temp !== null) parts.push('макс. t ' + fmtNum(b.temp) + ' °C');
      dayHtml.push('<li><b>' + fmtDate(new Date(it.k + 'T12:00:00').getTime()).slice(0, 5) + '</b> — ' + (parts.length ? parts.join(' · ') : 'без значимых записей') + '</li>');
    } else if (run === null){
      run = it.k;
    }
  });
  if (run){
    const lastK = dayItems[dayItems.length - 1].k;
    dayHtml.push('<li>' + (run === lastK ? lastK : run + '–' + lastK) + ' — данные не вносились</li>');
  }
  if (dayHtml.length){
    sect('По дням');
    H.push('<ul class="rep-list rep-days">' + dayHtml.join('') + '</ul>');
  }

  const activeMeds = p.meds.filter(m => m.status !== 'stopped');
  const medChanges = (p.medChanges || []).filter(c => c.ts >= st.from && c.ts <= to);
  if (activeMeds.length || medChanges.length){
    sect('Лекарства');
    if (activeMeds.length){
      H.push('<ul class="rep-list">' + activeMeds.map(m => {
        const labels = (m.slots || [m.slot]).map(id => (SLOTS.find(s => s.id === id) || { label: id }).label).join(', ');
        return '<li><b>' + labels + '</b>: ' + escapeHtml(m.name) + (m.dose ? ' (' + escapeHtml(m.dose) + ')' : '') + '</li>';
      }).join('') + '</ul>');
    } else {
      H.push('<p class="rep-empty">Действующих препаратов нет.</p>');
    }
    H.push('<p>Отметок «Принято»: <b>' + (st.totalDoses - st.missedMeds) + '</b> из ' + st.totalDoses + ' · пропущено: <b>' + st.missedMeds + '</b> (пропуски считаются по действующим препаратам)</p>');
    const actNames = { stopped: 'отменён', restarted: 'возобновлён', added: 'назначен' };
    if (medChanges.length){
      H.push('<ul class="rep-list">' + medChanges.map(c => '<li>' + fmtDateTime(c.ts) + ' — <b>' + escapeHtml(c.name) + '</b>' + (c.dose ? ' (' + escapeHtml(c.dose) + ')' : '') + ': ' + (actNames[c.action] || escapeHtml(c.action)) + '</li>').join('') + '</ul>');
    }
  } else {
    H.push('<p class="rep-empty">План приёма не задан.</p>');
  }

  sect('Рекомендации');
  const recs = [];
  if (critList.length) recs.push('🔴 Критические значения АД требуют немедленной консультации врача.');
  if (pr.length && inGoal === 0) recs.push('Все измерения выше целевого уровня — возможна неэффективность терапии, обсудите схему с врачом.');
  else if (pr.length && inGoal < pr.length) recs.push('Часть измерений выше цели — продолжайте контроль, обсудите с врачом при ухудшении.');
  if (lowSugarList.length) recs.push('Была гипогликемия — держите под рукой быстрые углеводы (сок, сахар).');
  if (hiSugarList.length) recs.push('Была гипергликемия — следите за питьём и питанием, обсудите с врачом.');
  if (st.falls) recs.push('Были падения — обсудите с врачом причину и безопасность передвижения.');
  const missing = [];
  if (!sg.length) missing.push('глюкоза');
  if (!wts.length) missing.push('вес');
  if (!tmps.length) missing.push('температура');
  if (missing.length) recs.push('Для полноты картины рекомендуется дополнить наблюдение: ' + missing.join(', ') + '.');
  if (!recs.length) recs.push('Показатели в пределах целевых значений — продолжайте текущее наблюдение.');
  H.push('<ul class="rep-list">' + recs.map(r => '<li>' + r + '</li>').join('') + '</ul>');

  H.push('<p class="rep-footer">Отчёт сформирован автоматически приложением «Компас заботы».</p>');
  H.push('</div>');
  return H.join('');
}

function copyReport(){
  const text = buildReport(state.ui.reportPeriod || 7);
  const done = () => showToast('Отчёт скопирован', 'ok');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); }
  catch (e){ showToast('Не удалось скопировать', 'error'); }
  ta.remove();
}

/* ---------- отправка копии и восстановление ---------- */

function snapshotsList(){
  try {
    return JSON.parse(localStorage.getItem(SNAP_KEY) || '[]');
  } catch (e){
    return [];
  }
}

function snapshotsHtml(){
  const list = snapshotsList();
  if (!list.length){
    return '<p class="muted">Снимков пока нет. Приложение само сохраняет копию данных раз в сутки (хранятся 14 последних) — отсюда можно восстановить их, если что-то затрётся.</p>';
  }
  const rows = list.slice().reverse().map(s =>
    '<div class="snap-row"><span>' + fmtDateTime(s.ts) + '</span>' +
    '<button class="btn sm" data-action="restoreSnap" data-ts="' + s.ts + '">Восстановить</button></div>'
  ).join('');
  return rows + '<p class="muted" style="margin-top:8px">Снимки хранятся в этом браузере и не удаляются при импорте с заменой.</p>';
}

async function shareBackup(){
  const json = JSON.stringify(state, null, 2);
  const name = 'kompas-backup-' + todayKey() + '.json';

  const downloadFallback = (msg) => {
    try {
      download(name, json, 'application/json');
      markExport();
      showToast(msg || 'Файл копии скачан', 'ok');
    } catch (e){
      showToast('Не удалось сохранить копию', 'error');
    }
  };

  // 1. Secure context и наличие API
  if (!window.isSecureContext || !navigator.share){
    downloadFallback('Меню «Поделиться» недоступно — файл скачан в «Загрузки», отправьте его оттуда');
    return;
  }

  // 2. Создаём файл
  let file = null;
  try {
    file = new File([json], name, { type: 'application/json' });
  } catch (e){
    downloadFallback('Файл копии скачан в «Загрузки»');
    return;
  }

  // 3. Поддержка шаринга именно файлов
  let canShareFiles = false;
  try {
    canShareFiles = navigator.canShare && navigator.canShare({ files: [file] });
  } catch (e){
    canShareFiles = false;
  }
  if (!canShareFiles){
    downloadFallback('Шаринг файлов не поддерживается — файл скачан в «Загрузки»');
    return;
  }

  // 4. Пытаемся поделиться
  try {
    await navigator.share({ files: [file], title: 'Резервная копия «Компас заботы»' });
    markExport();
    showToast('Копия отправлена', 'ok');
  } catch (err){
    if (err && err.name === 'AbortError'){
      showToast('Отправка отменена');
      return;
    }
    console.warn('navigator.share files failed:', err);
    // Запасной ход: системное меню живо — отправляем копию текстом
    try {
      await navigator.share({ title: 'Резервная копия «Компас заботы» от ' + todayKey(), text: JSON.stringify(state) });
      markExport();
      showToast('Копия отправлена текстом', 'ok');
    } catch (err2){
      if (err2 && err2.name === 'AbortError'){
        showToast('Отправка отменена');
        return;
      }
      console.warn('navigator.share text failed:', err2);
      downloadFallback('Не удалось открыть меню (' + (err && err.name || 'неизвестная ошибка') + ') — файл скачан в «Загрузки»');
    }
  }
}

function restoreSnap(ts){
  const snap = snapshotsList().find(s => s.ts === ts);
  if (!snap) return;
  modalConfirm('Восстановить данные на ' + fmtDateTime(ts) + '? Текущие данные будут заменены снимком.', { okText: 'Восстановить' })
    .then(ok => {
      if (!ok) return;
      state = normalizeState(JSON.parse(JSON.stringify(snap.state)));
      state.ui.activeTab = 'data';
      save();
      render();
      showToast('Данные восстановлены', 'ok');
    });
}
