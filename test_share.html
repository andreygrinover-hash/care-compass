<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест Web Share (файл)</title>
<style>
  body{font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
       margin:0;padding:16px;background:#f2f4f7;color:#1c2430}
  h1{font-size:1.1rem;margin:6px 0}
  .sub{color:#6b7686;font-size:.85rem;margin-bottom:14px}
  button{display:block;width:100%;padding:16px 14px;margin:10px 0;border:1px solid #dfe3e8;
         border-radius:12px;background:#fff;font-size:1rem;text-align:left;color:#1c2430}
  button.primary{background:#2563eb;border-color:#2563eb;color:#fff}
  pre{background:#1c2430;color:#e8f6ee;border-radius:12px;padding:12px;font-size:.8rem;
      white-space:pre-wrap;word-break:break-word;min-height:120px;margin:12px 0 0}
</style>
</head>
<body>
<h1>Решающий тест Web Share (файл)</h1>
<p class="sub">Тестовый файл создаётся один раз при загрузке страницы. Нажимайте кнопки сверху вниз. Всё, что произойдёт, пишется в журнал ниже.</p>

<button class="primary" id="t1">Тест 1 — файл: share() первой строкой (никаких await)</button>
<button id="t2">Тест 2 — файл: пауза 100 мс перед share()</button>
<button id="t3">Тест 3 — только текст (контроль: должен работать)</button>

<pre id="log">Журнал появится здесь.</pre>

<script>
'use strict';
var TEST_FILE = new File(['Компас заботы — тестовое вложение для Web Share'], 'test.txt', { type: 'text/plain' });
var logEl = document.getElementById('log');
var t0 = Date.now();
function ts(){ return '+' + Math.round(Date.now() - t0) + ' мс'; }
function log(msg){
  if (logEl.textContent.indexOf('Журнал') === 0) logEl.textContent = '';
  logEl.textContent += '[' + ts() + '] ' + msg + '\n';
}

log('Страница загружена');
log('navigator.share: ' + (navigator.share ? 'есть' : 'НЕТ'));
log('isSecureContext: ' + (window.isSecureContext ? 'да' : 'нет'));
log('userAgent: ' + navigator.userAgent);
try {
  log('canShare({files}) при загрузке: ' + navigator.canShare({ files: [TEST_FILE] }));
} catch(e){
  log('canShare({files}) при загрузке: исключение ' + e.name);
}

document.getElementById('t1').addEventListener('click', function(){
  log('Тест 1: нажатие');
  if (!navigator.share){ log('Тест 1: navigator.share отсутствует'); return; }
  try {
    navigator.share({ files: [TEST_FILE], title: 'Тест', text: 'Тестовое вложение из Компаса заботы' })
      .then(function(){
        log('Тест 1: УСПЕХ — файл ушёл в системное меню обмена');
      })
      .catch(function(e){
        log('Тест 1: ОТКАЗ — ' + e.name + ': ' + e.message);
      });
  } catch(e){
    log('Тест 1: ОТКАЗ (синхронное исключение) — ' + e.name + ': ' + e.message);
  }
});

document.getElementById('t2').addEventListener('click', function(){
  log('Тест 2: нажатие, пауза 100 мс…');
  if (!navigator.share){ log('Тест 2: navigator.share отсутствует'); return; }
  setTimeout(function(){
    try {
      navigator.share({ files: [TEST_FILE], title: 'Тест', text: 'Тестовое вложение из Компаса заботы' })
        .then(function(){ log('Тест 2: УСПЕХ'); })
        .catch(function(e){ log('Тест 2: ОТКАЗ — ' + e.name + ': ' + e.message); });
    } catch(e){
      log('Тест 2: ОТКАЗ (синхронное исключение) — ' + e.name + ': ' + e.message);
    }
  }, 100);
});

document.getElementById('t3').addEventListener('click', function(){
  log('Тест 3: нажатие');
  if (!navigator.share){ log('Тест 3: navigator.share отсутствует'); return; }
  navigator.share({ title: 'Тест', text: 'Тестовый текст из Компаса заботы' })
    .then(function(){ log('Тест 3: УСПЕХ'); })
    .catch(function(e){ log('Тест 3: ОТКАЗ — ' + e.name + ': ' + e.message); });
});
</script>
</body>
</html>
